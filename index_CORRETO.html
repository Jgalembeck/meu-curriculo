<style>
:root{--ink:#1F2937;--mute:#5b6676;--line:#e3e8ee;--sky:#0369a1;--sky2:#0ea5e9;--bg:#eef2f6;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Raleway',system-ui,sans-serif;background:radial-gradient(900px 420px at 50% -120px,rgba(14,165,233,.055),transparent 68%),var(--bg);color:var(--ink);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased}
.app{max-width:820px;margin:0 auto;min-height:100vh;background:var(--card);display:flex;flex-direction:column}
@media(min-width:860px){.app{margin:24px auto;min-height:0;border-radius:20px;overflow:hidden;box-shadow:0 26px 74px rgba(31,41,55,.14),0 2px 8px rgba(31,41,55,.05),inset 0 1px 0 rgba(255,255,255,.7)}}
header{background:var(--ink);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.mark{font-weight:900;font-size:26px;letter-spacing:-.04em}.mark i{font-style:normal;font-weight:400;color:var(--sky2)}
.who{flex:1;min-width:150px}.who b{display:block;font-size:16px}.who span{font-size:13px;color:#cbd5e1}
.hbtn{font:inherit;font-size:13px;font-weight:700;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:8px 14px;cursor:pointer}
.hbtn.main{background:var(--sky2);border-color:var(--sky2);color:#06202f}
.hbtn[aria-pressed=true]{background:#fff;color:var(--ink)}
.lang{display:flex;gap:4px}
nav{display:flex;border-bottom:1px solid var(--line);background:#f8fafc}
nav button{flex:1;font:inherit;font-size:14px;font-weight:700;color:var(--mute);background:none;border:0;border-bottom:3px solid transparent;padding:13px 6px;cursor:pointer}
nav button[aria-current=step]{color:var(--ink);border-bottom-color:var(--sky2)}
nav button.done{color:var(--sky)}
main{flex:1;padding:30px clamp(20px,5vw,48px) 40px}
section[hidden]{display:none}
h1{font-size:clamp(28px,5vw,40px);line-height:1.12;margin:0 0 6px;letter-spacing:-.02em;font-weight:900}
h2{font-size:20px;margin:0 0 4px;font-weight:800}
.tag{color:var(--sky);font-weight:700;font-size:17px;margin:0 0 20px}
p{margin:0 0 14px;max-width:64ch}
.lead{font-size:17px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);padding:11px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--ink);color:#fff}
.btn:hover{transform:translateY(-1px)}
:focus-visible{outline:3px solid var(--sky2);outline-offset:2px}
.lens{border-top:1px solid var(--line);padding:22px 0}
.lens:first-of-type{border-top:0;padding-top:4px}
.lens small{color:var(--mute);font-size:13px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 34px;gap:10px;align-items:center;margin:11px 0 2px;font-size:14px;font-weight:600}
.bar button{all:unset;cursor:pointer;text-align:left}
.track{height:10px;border-radius:99px;background:#e8edf2;overflow:hidden}
.fill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky2),var(--sky));border-radius:99px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.fill.alt{background:var(--ink)}
.bar output{font-variant-numeric:tabular-nums;text-align:right}
.why{font-size:13.5px;color:var(--mute);margin:0 0 8px 0;max-width:60ch}
.why[hidden]{display:none}
sup a{color:var(--sky);text-decoration:none;font-weight:700}
.cred{display:grid;gap:14px;margin-top:10px}
.cred div{border-left:3px solid var(--sky2);padding:2px 0 2px 14px}
.cred b{display:block}.cred span{font-size:14px;color:var(--mute)}
.cred a{color:var(--sky);font-weight:700}
.tl{list-style:none;margin:10px 0 0;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 22px 22px}
.tl li:before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--sky2);border:2px solid #fff}
.tl time{font-weight:800;font-size:14px;color:var(--sky)}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.foot ol{margin:6px 0 0;padding-left:18px}.foot li{margin-bottom:5px}
footer{padding:16px 24px;font-size:13px;color:var(--mute);border-top:1px solid var(--line);text-align:center}
footer a{color:var(--mute)}
@media(max-width:560px){.bar{grid-template-columns:1fr 34px}.bar .track{grid-column:1/-1;order:3}nav button{font-size:12.5px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.mark{position:relative;width:44px;height:44px;display:grid;place-items:center}
.mark:after{content:"";position:absolute;inset:0;border:1px solid rgba(125,211,252,.3);border-left-color:#0ea5e9;border-radius:50%;animation:o 7s linear infinite}
@keyframes o{to{transform:rotate(360deg)}}
#main{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.msg.user{align-self:flex-end}
.av{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center}.av i{font-style:normal;font-weight:400;color:var(--sky2)}
.bub{background:#f1f5f9;border-radius:6px 18px 18px 18px;padding:12px 16px;font-size:15.5px;min-width:0;max-width:660px}
.msg.user .bub{background:var(--sky);color:#fff;border-radius:18px 6px 18px 18px}
.msg.bot:has(.card) .bub{background:none;padding:0;flex:1}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#94a3b8;animation:b 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{40%{transform:translateY(-5px)}}
.card{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:#fff;box-shadow:0 10px 28px rgba(31,41,55,.065),0 1px 2px rgba(31,41,55,.035),inset 0 1px 0 rgba(255,255,255,.75);transition:box-shadow .28s ease,transform .28s ease,border-color .28s ease}
#acts{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 22px;display:flex;flex-wrap:wrap;gap:8px}#acts:empty{display:none}
.pill2{font:inherit;font-weight:700;font-size:14px;border:1.5px solid var(--sky);color:var(--sky);background:#fff;border-radius:999px;padding:9px 16px;cursor:pointer}
.pill2:hover{background:var(--sky);color:#fff}.pill2.alt{border-color:var(--line);color:var(--mute)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.sp{font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:99px;background:#e8edf2;color:var(--mute);transition:.3s}.sp.on{background:var(--sky2);color:#06202f;box-shadow:0 0 0 4px rgba(14,165,233,.2)}
.bar.on button{color:var(--sky)}
.rg{transition:stroke-dashoffset 1.3s cubic-bezier(.2,.7,.2,1)}
.ringbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.lg{font-size:14px}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}

.mark,.av{background:#fff var(--logo) center/76% no-repeat}.mark{border-radius:12px}.mark:after{inset:-5px;border-radius:50%}
header{position:sticky}#pg{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--sky2),#f97316);transition:width .8s}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(circle at 20% 20%,rgba(14,165,233,.22),transparent 35%),radial-gradient(circle at 80% 70%,rgba(249,115,22,.14),transparent 35%);animation:au 18s ease-in-out infinite alternate}@keyframes au{to{transform:translate(4%,3%) scale(1.08)}}
@keyframes up{from{opacity:0;transform:translateY(12px) scale(.98);filter:blur(4px)}}
.card{position:relative;isolation:isolate}.card:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:.3s;background:radial-gradient(240px circle at var(--x,50%) var(--y,50%),rgba(14,165,233,.10),transparent)}.card:hover:after{opacity:1}.card:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(31,41,55,.085),0 2px 5px rgba(31,41,55,.04),inset 0 1px 0 rgba(255,255,255,.8)}
.fill{position:relative;overflow:hidden}.fill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:translateX(-100%);animation:sh 1.6s .9s both}@keyframes sh{to{transform:translateX(100%)}}
.ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:-1}.ln path{fill:none;stroke:var(--sky2);stroke-width:2;opacity:.6;stroke-dasharray:500;stroke-dashoffset:500;animation:dr .9s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.scan{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}.st{animation:up .6s calc(var(--i)*.18s) both}.st b{font-size:clamp(32px,6vw,46px);font-weight:900;line-height:1;background:linear-gradient(120deg,var(--ink),var(--sky2));-webkit-background-clip:text;background-clip:text;color:transparent}.st span{display:block;font-size:13.5px;color:var(--mute);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.cols small{color:var(--mute);font-weight:700;display:block;margin-bottom:6px}
.ev{font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;color:var(--mute);transition:all .35s}.ev.lit{background:linear-gradient(120deg,#e0f2fe,#fff);border-color:var(--sky2);color:var(--ink);box-shadow:0 6px 18px rgba(14,165,233,.22);transform:translateX(4px)}
.pill2.sel{background:var(--sky);color:#fff}.res{font-weight:800;color:var(--sky);margin:10px 0 0}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.cc{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}.cc h3{font-size:16px;margin:0 0 2px}.cc small{color:var(--mute);font-size:13px}
.seg{display:flex;gap:3px;margin:4px 0 8px}.seg i{flex:1;height:10px;border-radius:3px;background:#e8edf2;transition:background .3s}.go .seg i.on{background:var(--sky2);transition-delay:var(--d)}.lv{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-top:6px}
.ver{display:inline-flex;gap:7px;align-items:center;font-size:13px;font-weight:800;color:var(--sky);text-decoration:none;margin-top:8px}.ver:before,.ing:before{content:"✓";display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--sky);color:#fff;font-size:11px;animation:pl 2s infinite}.ing:before{content:"";background:#f97316;width:10px;height:10px;display:inline-block;margin-right:7px}@keyframes pl{50%{box-shadow:0 0 0 6px rgba(14,165,233,.2)}}
.bc{background:linear-gradient(135deg,#17202d,#26374a);color:#fff;border:0}.bc .contact-title h2{color:#fff}.bc .contact-title .lead{color:#cbd5e1}.bc .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}.bc .btn.primary{background:var(--sky2);color:#06202f;border-color:var(--sky2)}.bc .pill2{background:transparent;color:#cbd5e1;border-color:rgba(255,255,255,.3)}.bc .pill2.sel{background:#fff;color:var(--ink)}
.bcl{display:flex;gap:14px;align-items:center}.bcl .mark{flex:none}.bcl b{font-size:19px}.bcl small,.bc p{color:#cbd5e1}.toast{height:20px;color:#7dd3fc!important;font-weight:700;font-size:14px;margin:8px 0 0}
@media(max-width:560px){.cols{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}.ln path{stroke-dashoffset:0}}

/* V4.0 identity refinement */
.brand-mark{width:48px;height:48px;position:relative;display:grid;place-items:center;flex:0 0 auto}
.brand-mark .logo-img{width:44px;height:44px;display:block;object-fit:contain;filter:drop-shadow(0 5px 12px rgba(0,0,0,.16))}
.brand-mark:after{content:"";position:absolute;inset:-4px;border:1px solid rgba(125,211,252,.18);border-right-color:rgba(14,165,233,.72);border-bottom-color:rgba(14,165,233,.18);border-radius:50%;transform:rotate(-24deg);animation:brandOrbit 9s linear infinite;pointer-events:none}
.brand-mark:before{content:"";position:absolute;width:4px;height:4px;border-radius:50%;right:-1px;top:7px;background:#7dd3fc;box-shadow:0 0 10px rgba(125,211,252,.75);animation:brandPulse 2.8s ease-in-out infinite;pointer-events:none}
@keyframes brandOrbit{to{transform:rotate(336deg)}}
@keyframes brandPulse{50%{opacity:.45;transform:scale(.75)}}
.bc .brand-mark{margin-left:-2px}
.method-lead{margin-bottom:18px}.eyebrow{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:var(--sky);margin-bottom:5px}.method-lead h3{margin:0 0 5px;font-size:20px}.method-lead p{margin:0;color:var(--mute);font-size:14px}
.method-flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:18px 0 24px;position:relative}.method-flow .mf{position:relative;min-height:138px;padding:15px 13px 14px;text-align:left;border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:0 7px 20px rgba(31,41,55,.05);z-index:1}.method-flow .mf:after{content:"";position:absolute;right:-14px;top:50%;width:20px;height:1px;background:linear-gradient(90deg,#cbd5e1,var(--sky2));z-index:0}.method-flow .mf:last-child:after{display:none}.method-flow .mf .mn{display:block;font-size:10px;letter-spacing:.12em;color:var(--sky);font-weight:900;margin-bottom:8px}.method-flow .mf h4{margin:0 0 7px;font-size:14px;line-height:1.2}.method-flow .mf p{margin:0;color:var(--mute);font-size:12px;line-height:1.45}.assessment-lead{margin:4px 0 14px;padding-top:4px;border-top:1px solid var(--line)}.assessment-lead h3{margin:0 0 4px;font-size:17px}.assessment-lead p{margin:0;color:var(--mute);font-size:13.5px}
.assessment-network{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 72px 150px;gap:10px;align-items:stretch;padding:4px 0 2px}.trait-list{display:grid;gap:7px}.trait-row{position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:visible;transition:.3s}.trait-row:after{content:"";position:absolute;z-index:-0;right:-82px;top:50%;width:82px;height:1px;background:linear-gradient(90deg,#dbe4ec,#cbd5e1);opacity:.6;transition:.35s}.trait-row.active:after{background:linear-gradient(90deg,rgba(14,165,233,.28),rgba(14,165,233,.9));box-shadow:0 0 7px rgba(14,165,233,.25);opacity:1}.trait-row button{width:100%;border:0;background:none;text-align:left;padding:12px 12px 9px;color:var(--ink);font:inherit;font-weight:800;cursor:pointer}.trait-row .mini-bar{height:3px;margin:0 12px 10px;background:#e8edf2;border-radius:99px;overflow:hidden}.trait-row .mini-bar i{display:block;height:100%;width:var(--v);background:linear-gradient(90deg,var(--sky),var(--sky2));transform-origin:left;transition:.5s}.trait-row.active{border-color:rgba(14,165,233,.5);box-shadow:0 8px 22px rgba(14,165,233,.12)}.trait-row.active .mini-bar i{box-shadow:0 0 10px rgba(14,165,233,.5)}.trait-why{display:none;padding:0 12px 11px;color:var(--mute);font-size:12.5px;line-height:1.45}.trait-row.active .trait-why{display:block}.signal-rail{position:relative;min-height:100%;display:flex;align-items:center;justify-content:center}.signal-rail:before{content:"";position:absolute;left:50%;top:9px;bottom:9px;width:1px;background:linear-gradient(180deg,transparent,#cbd5e1 12%,#cbd5e1 88%,transparent)}.signal-line{position:absolute;left:50%;top:calc(var(--sy,14%));width:100%;height:1px;background:linear-gradient(90deg,rgba(14,165,233,0),rgba(14,165,233,.8),rgba(14,165,233,0));transform:translateY(-50%);transition:top .45s ease;filter:drop-shadow(0 0 5px rgba(14,165,233,.45))}.signal-dot{position:absolute;left:50%;top:calc(var(--sy,14%));width:10px;height:10px;border-radius:50%;background:#7dd3fc;box-shadow:0 0 0 5px rgba(14,165,233,.1),0 0 16px rgba(14,165,233,.75);transform:translate(-50%,-50%);transition:top .45s cubic-bezier(.2,.8,.2,1)}.source-list{display:flex;flex-direction:column;justify-content:space-around;gap:8px}.source-node{font-size:11px;font-weight:900;color:var(--mute);padding:9px 9px;border:1px solid var(--line);border-radius:10px;background:#f8fafc;text-align:center;transition:.35s}.source-node.on{color:#06344d;background:#e0f2fe;border-color:rgba(14,165,233,.6);box-shadow:0 5px 16px rgba(14,165,233,.16);transform:translateX(2px)}.source-note{margin:10px 0 0;color:var(--mute);font-size:11.5px}.source-details{margin-top:12px}.source-details summary{cursor:pointer;color:var(--sky);font-weight:800;font-size:12px}.source-details .foot{margin-top:8px}

document.addEventListener('pointerleave',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});

const IOB='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){IOB.unobserve(e.target);play(e.target)}}),{rootMargin:'0px 0px -10% 0px'}):null;
function count(o,d){const v=+o.dataset.v;if(RM)return void(o.textContent=v);setTimeout(()=>{let st=null;const step=ts=>{st=st||ts;const q=Math.min((ts-st)/1100,1);o.textContent=Math.round(v*(1-Math.pow(1-q,3)));if(q<1)requestAnimationFrame(step)};requestAnimationFrame(step)},d)}
function play(c){c.classList.add('in');[...c.querySelectorAll('output')].forEach((o,i)=>count(o,o.closest('.cmx-core')?320:i*140))}
function mount(el){new Set([el,...el.querySelectorAll('.card')]).forEach(c=>{c.classList.add('go');c.querySelectorAll('.fill').forEach((f,i)=>{f.style.width=f.dataset.v+'%';f.style.setProperty('--i',i)});c.querySelectorAll('.rg').forEach((r,i)=>{r.style.setProperty('--o',r.dataset.o);r.style.setProperty('--c',r.getAttribute('stroke-dasharray'));r.style.setProperty('--i',i)});if(!c.matches('.card'))return;if(RM||!IOB)play(c);else IOB.observe(c)});const tri=el.matches('.tri')?el:el.querySelector('.tri');if(tri)setTimeout(()=>pick(tri,0),220)}
document.addEventListener('pointerleave',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}},true);
location.hash=='#360'?sheet():start();
</script>
</body>
</html>
