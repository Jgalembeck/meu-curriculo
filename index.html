        :root {
            --dark-bg: #1F2937;
            --light-text: #d1d5db;

            --orange-accent: #f97316;
            --white: #FFFFFF;
            --light-bg: #f3f4f6;
        }

        body {
            background-color: var(--light-bg);
            font-family: 'Raleway', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .main-container {
            width: 100%;
            max-width: 600px;
        }
        
        .info-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .info-header h1 {
            font-weight: 700;
            color: var(--dark-bg);
            margin-bottom: 10px;
        }

        #chat-component {
            width: 100%;
            aspect-ratio: 1.91 / 1;
            background-color: var(--white);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: var(--dark-bg);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .logo {
            width: 40px;
            height: 40px;
        }
        .chat-header .info h3 {
            color: var(--white);
            font-weight: 700;
            font-size: 16px;
            margin: 0;
        }
        .chat-header .info p {
            color: var(--light-text);
            font-size: 12px;
            margin: 2px 0 0 0;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .message {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 85%;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s forwards;
        }
        
        .message.bot {
            align-self: flex-start;
        }

        .message .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: var(--dark-bg);
            flex-shrink: 0;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .message.bot .message-bubble {
            background-color: #E5E7EB;
            color: var(--dark-bg);
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: #9CA3AF;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        .chat-actions {
            padding: 15px 20px;
            border-top: 1px solid #E5E7EB;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            background-color: var(--white);
            flex-wrap: wrap;
        }

        .action-button {
            background-color: var(--blue-accent);
            color: var(--white);
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-family: 'Raleway', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.5s forwards;
        }
        .action-button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .action-button.secondary {
            background-color: #D1D5DB;
            color: var(--dark-bg);
        }

        .download-button {
            background-color: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-family: 'Raleway', sans-serif;
            font-size: 16px;
            transition: opacity 0.3s;
            margin-top: 20px;
        }
        .download-button:hover { opacity: 0.9; }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

    </style>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const chatActions = document.getElementById('chat-actions');
        let currentStep = 0;
        let conversationFlow;

        const conversationFlows = {
            pt: [
                {
                    text: 'Recrutador, sei que você já viu dezenas de perfis hoje. Que tal uma abordagem diferente?',
                    actions: [{ text: 'Me surpreenda.', nextStep: 1 }]
                },
                {
                    text: 'Para iniciar sua carreira em UX, o Jonas está finalizando o <strong>Certificado de UX Design do Google</strong> e é graduado em <strong>Design pela UTFPR</strong>.',
                    actions: [{ text: 'Interessante...', nextStep: 2 }]
                },
                {
                    text: 'Seu projeto de graduação explora a <strong>evolução do design de UX/UI em sistemas de Inteligência Artificial</strong>, mostrando seu foco em tecnologias emergentes.',
                    actions: [{ text: 'Quero saber mais!', nextStep: 3 }]
                },
                {
                    text: 'Excelente! O currículo completo tem todos os detalhes sobre esses e outros projetos. Gostaria de vê-lo?',
                    actions: [
                        { text: 'Ver Currículo Agora', action: 'openResume' },
                        { text: 'Agora não', nextStep: 4, isSecondary: true }
                    ]
                },
                {
                    text: 'Entendido. Se mudar de ideia, sabe onde encontrar!',
                    actions: []
                }
            ],
            en: [
                {
                    text: 'Recruiter, I know you\'ve seen dozens of profiles today. How about a different approach?',
                    actions: [{ text: 'Surprise me.', nextStep: 1 }]
                },
                {
                    text: 'To start his UX career, Jonas is completing the <strong>Google UX Design Certificate</strong> and holds a <strong>Bachelor\'s in Design from UTFPR</strong>.',
                    actions: [{ text: 'Interesting...', nextStep: 2 }]
                },
                {
                    text: 'His graduation project explores the <strong>evolution of UX/UI design in Artificial Intelligence systems</strong>, showcasing his focus on emerging technologies.',
                    actions: [{ text: 'Tell me more!', nextStep: 3 }]
                },
                {
                    text: 'Excellent! The full resume has all the details on these and other projects. Would you like to see it?',
                    actions: [
                        { text: 'View Resume Now', action: 'openResume' },
                        { text: 'Not right now', nextStep: 4, isSecondary: true }
                    ]
                },
                {
                    text: 'Understood. If you change your mind, you know where to find me!',
                    actions: []
                }
            ]
        };

        function showTypingIndicator() {
            const typingMessage = document.createElement('div');
            typingMessage.className = 'message bot typing-indicator-container';
            typingMessage.innerHTML = `
                <div class="avatar"></div>
                <div class="message-bubble typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatMessages.appendChild(typingMessage);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return typingMessage;
        }

        function renderStep(stepIndex) {
            const step = conversationFlow[stepIndex];
            chatActions.innerHTML = ''; // Clear previous actions

            const typingIndicator = showTypingIndicator();

            setTimeout(() => {
                if (typingIndicator.parentNode) {
                    chatMessages.removeChild(typingIndicator);
                }
                
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message bot';
                messageDiv.innerHTML = `
                    <div class="avatar">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="50" fill="#1F2937"/><text x="28" y="75" font-family="Raleway, sans-serif" font-weight="900" font-size="80" fill="#FFFFFF" text-anchor="middle">J</text><text x="72" y="75" font-family="Raleway, sans-serif" font-weight="300" font-size="80" fill="#0ea5e9" text-anchor="middle">G</text></svg>
                    </div>
                    <div class="message-bubble">${step.text}</div>
                `;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                if (step.actions) {
                    step.actions.forEach((action, index) => {
                        setTimeout(() => {
                            const button = document.createElement('button');
                            button.className = 'action-button';
                            if (action.isSecondary) {
                                button.classList.add('secondary');
                            }
                            button.textContent = action.text;
                            button.onclick = () => handleAction(action);
                            chatActions.appendChild(button);
                        }, index * 150);
                    });
                }
            }, 1000 + Math.random() * 500); // Simulate typing delay
        }
        
        function handleAction(action) {
            if (action.action === 'openResume') {
                const resumeTemplate = document.getElementById('resume-template');
                const resumeHTML = resumeTemplate.innerHTML;
                const resumeBlob = new Blob([resumeHTML], { type: 'text/html' });
                const resumeUrl = URL.createObjectURL(resumeBlob);
                window.open(resumeUrl, '_blank');
            }
            if (action.nextStep !== undefined) {
                currentStep = action.nextStep;
                renderStep(currentStep);
            } else {
                 chatActions.innerHTML = '';
            }
        }

        function startConversation(lang) {
            conversationFlow = conversationFlows[lang];
            chatMessages.innerHTML = '';
            currentStep = 0;
            renderStep(currentStep);
        }

        function showLanguageSelection() {
            chatMessages.innerHTML = '';
            chatActions.innerHTML = '';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.style.animationDelay = '0s';
            messageDiv.style.opacity = 1;
            messageDiv.style.transform = 'translateY(0)';
            messageDiv.innerHTML = `
                <div class="avatar">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="50" fill="#1F2937"/><text x="28" y="75" font-family="Raleway, sans-serif" font-weight="900" font-size="80" fill="#FFFFFF" text-anchor="middle">J</text><text x="72" y="75" font-family="Raleway, sans-serif" font-weight="300" font-size="80" fill="#0ea5e9" text-anchor="middle">G</text></svg>
                </div>
                <div class="message-bubble">Olá! / Hello!</div>
            `;
            chatMessages.appendChild(messageDiv);

            const ptButton = document.createElement('button');
            ptButton.className = 'action-button';
            ptButton.textContent = 'Português';
            ptButton.onclick = () => startConversation('pt');
            ptButton.style.opacity = 1;
            ptButton.style.transform = 'translateY(0)';
            
            const enButton = document.createElement('button');
            enButton.className = 'action-button';
            enButton.textContent = 'English';
            enButton.onclick = () => startConversation('en');
            enButton.style.opacity = 1;
            enButton.style.transform = 'translateY(0)';

            chatActions.appendChild(ptButton);
            chatActions.appendChild(enButton);
        }

        function downloadThumbnail() {
            const node = document.getElementById('chat-component');
            const button = document.querySelector('.download-button');
            
            const originalMessages = chatMessages.innerHTML;
            const originalActions = chatActions.innerHTML;
            
            // Set to the first message of the PT flow for the thumbnail
            conversationFlow = conversationFlows.pt;
            chatMessages.innerHTML = '';
            chatActions.innerHTML = '';
            const step = conversationFlow[0];
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.style.opacity = 1;
            messageDiv.style.transform = 'translateY(0)';
            messageDiv.innerHTML = `
                <div class="avatar">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="50" fill="#1F2937"/><text x="28" y="75" font-family="Raleway, sans-serif" font-weight="900" font-size="80" fill="#FFFFFF" text-anchor="middle">J</text><text x="72" y="75" font-family="Raleway, sans-serif" font-weight="300" font-size="80" fill="#0ea5e9" text-anchor="middle">G</text></svg>
                </div>
                <div class="message-bubble">${step.text}</div>
            `;
            chatMessages.appendChild(messageDiv);
            const actionButton = document.createElement('button');
            actionButton.className = 'action-button';
            actionButton.textContent = step.actions[0].text;
            actionButton.style.opacity = 1;
            actionButton.style.transform = 'translateY(0)';
            chatActions.appendChild(actionButton);


            button.textContent = 'Gerando...';
            button.disabled = true;

            setTimeout(() => {
                htmlToImage.toPng(node, { 
                    canvasWidth: 1200, 
                    canvasHeight: 627,
                    pixelRatio: 1 
                })
                .then(function (dataUrl) {
                    const link = document.createElement('a');
                    link.download = 'Thumbnail-Chat-JonasGalembeck.png';
                    link.href = dataUrl;
                    link.click();
                })
                .catch(function (error) {
                    console.error('Oops, something went wrong!', error);
                    alert('Ocorreu um erro ao gerar a imagem.');
                })
                .finally(() => {
                    chatMessages.innerHTML = originalMessages;
                    chatActions.innerHTML = originalActions;
                    button.textContent = 'Baixar Miniatura (PNG)';
                    button.disabled = false;
                    showLanguageSelection(); // Go back to the initial state
                });
            }, 500);
        }

        // Initialize with language selection
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', showLanguageSelection);
        } else {
            showLanguageSelection();
        }
    </script>

</body>
</html>
