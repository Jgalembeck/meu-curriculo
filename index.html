            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            display: flex;

            transition: opacity 0.3s ease, transform 0.3s ease;

                box-shadow: none;
            }
            #resume-view {
                 /* More space for mobile header which can wrap */
                 padding-top: 150px;
            }
        }

        .chat-header {
            background-color: var(--dark-bg);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .chat-header .info h3 { color: var(--white); font-weight: 700; font-size: 16px; margin: 0; }
        .chat-header .info p { color: var(--light-text); font-size: 12px; margin: 2px 0 0 0; }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .message {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 85%;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s forwards;
        }
        .message.bot { align-self: flex-start; }
        .message .avatar { width: 30px; height: 30px; border-radius: 50%; background-color: var(--dark-bg); flex-shrink: 0; overflow: hidden; }
        .message-bubble { padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; }
        .message.bot .message-bubble { background-color: #E5E7EB; color: var(--dark-bg); border-bottom-left-radius: 4px; }

        .typing-indicator { display: flex; gap: 4px; padding: 12px 16px; }
        .typing-indicator span { width: 8px; height: 8px; background-color: #9CA3AF; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        .chat-actions {
            padding: 15px 20px;
            border-top: 1px solid #E5E7EB;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            background-color: var(--white);
            flex-wrap: wrap;

            font-family: 'Raleway', sans-serif;

            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0;
            transform: translateY(10px);

        .resume-container { display: none; }

        .lang-button.active { background-color: #1F2937; color: white; }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

                messageDiv.innerHTML = `
                    <div class="avatar">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="50" fill="#1F2937"/><text x="28" y="75" font-family="Raleway, sans-serif" font-weight="900" font-size="80" fill="#FFFFFF" text-anchor="middle">J</text><text x="72" y="75" font-family="Raleway, sans-serif" font-weight="300" font-size="80" fill="#0ea5e9" text-anchor="middle">G</text></svg>
                    </div>
                    <div class="message-bubble">${step.text}</div>
                `;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                if (step.actions) {
                    step.actions.forEach((action, index) => {
                        setTimeout(() => {
                            const button = document.createElement('button');
                            button.className = 'action-button';
                            if (action.isSecondary) button.classList.add('secondary');
                            button.textContent = action.text;
                            button.onclick = () => handleAction(action);
                            chatActions.appendChild(button);
                        }, index * 150);
                    });
                }
            }, 1000 + Math.random() * 500);
        }
        
        function handleAction(action) {
            if (action.action === 'openResume') showResumeView();
            if (action.action === 'link') window.open(action.url, '_blank');
            
            if (action.nextStep !== undefined) {
                currentStep = action.nextStep;
                renderStep(currentStep);
            } else if (action.action !== 'openResume') {
                 chatActions.innerHTML = '';
            }
        }

        function startConversation(lang) {
            currentLanguage = lang;
            conversationFlow = conversationFlows[lang];
            chatMessages.innerHTML = '';
            currentStep = 0;
            renderStep(currentStep);
        }

        function showLanguageSelection() {
            chatMessages.innerHTML = '';
            chatActions.innerHTML = '';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.style.cssText = 'animation-delay: 0s; opacity: 1; transform: translateY(0);';
            messageDiv.innerHTML = `
                <div class="avatar">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="50" fill="#1F2937"/><text x="28" y="75" font-family="Raleway, sans-serif" font-weight="900" font-size="80" fill="#FFFFFF" text-anchor="middle">J</text><text x="72" y="75" font-family="Raleway, sans-serif" font-weight="300" font-size="80" fill="#0ea5e9" text-anchor="middle">G</text></svg>
                </div>
                <div class="message-bubble">Olá! / Hello!</div>
            `;
            chatMessages.appendChild(messageDiv);

            const ptButton = document.createElement('button');
            ptButton.className = 'action-button';
            ptButton.textContent = 'Português';
            ptButton.onclick = () => startConversation('pt');
            ptButton.style.cssText = 'opacity: 1; transform: translateY(0);';
            
            const enButton = document.createElement('button');
            enButton.className = 'action-button';
            enButton.textContent = 'English';
            enButton.onclick = () => startConversation('en');
            enButton.style.cssText = 'opacity: 1; transform: translateY(0);';

            chatActions.appendChild(ptButton);
            chatActions.appendChild(enButton);
        }

        // --- Resume View Functions ---
        function showResumeView() {
            chatComponent.classList.add('hidden');
            resumeView.innerHTML = resumeTemplate.innerHTML;
            resumeView.style.display = 'block';
            document.body.style.overflow = 'auto';

            document.getElementById('back-to-chat-btn').addEventListener('click', hideResumeView);
            document.getElementById('btn-pt').addEventListener('click', () => switchLanguage('pt'));
            document.getElementById('btn-en').addEventListener('click', () => switchLanguage('en'));
            
            // The download link is now handled by switchLanguage
            
            switchLanguage(currentLanguage);
        }

        function hideResumeView() {
            resumeView.style.display = 'none';
            resumeView.innerHTML = '';
            chatComponent.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        
        function switchLanguage(lang) {
            currentLanguage = lang;
            const btnPt = document.getElementById('btn-pt');
            const btnEn = document.getElementById('btn-en');
            const resumePt = document.getElementById('resume-pt');
            const resumeEn = document.getElementById('resume-en');
            const downloadLink = document.getElementById('download-link');

            // Define the paths to your finished PDF files
            const pdfPathPt = './Curriculo_Jonas_Galembeck_PT.pdf';
            const pdfPathEn = './Curriculo_Jonas_Galembeck_EN.pdf';

            if (lang === 'pt') {
                resumePt.classList.add('active');
                resumeEn.classList.remove('active');
                btnPt.classList.add('active');
                btnEn.classList.remove('active');
                downloadLink.href = pdfPathPt;
            } else {
                resumeEn.classList.add('active');
                resumePt.classList.remove('active');
                btnEn.classList.add('active');
                btnPt.classList.remove('active');
                downloadLink.href = pdfPathEn;
            }
        }

        // --- Initializer ---
        document.addEventListener('DOMContentLoaded', showLanguageSelection);

    </script>
</body>
</html>
